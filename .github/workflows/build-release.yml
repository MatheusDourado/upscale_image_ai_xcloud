name: Build e release

on:
  push:
    branches: [main, 'claude/**']
    paths: ['src/**', 'tools/**', 'tests/**', 'android/**', 'script.js', 'player/**', '.github/workflows/build-release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v8.6.5). Vazio = só build, sem release'
        required: false
        default: ''
      notes:
        description: 'Arquivo de notas (ex.: docs/release-v8.6.5.md)'
        required: false
        default: ''
      target:
        description: 'Commit da tag (vazio = commit deste build)'
        required: false
        default: ''
      apk:
        description: 'Anexar o APK Android à release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ferramentas Android (sem SDK)
        run: sudo apt-get update -q && sudo apt-get install -y -q aapt dalvik-exchange zipalign apksigner
      - name: Userscript e testes
        run: |
          python3 tools/build.py
          git diff --exit-code -- better-xcloud-image-filter.user.js output/restoration.bundle.js || { echo "::error::Arquivos gerados desatualizados: rode python3 tools/build.py e faça commit"; exit 1; }
          node --test tests/*.cjs
          node --check better-xcloud-image-filter.user.js
          node --check player/player.js
      - name: Regressões WebGL e DOM
        run: |
          python3 -m pip install playwright==1.60.0
          python3 -m playwright install --with-deps chromium
          python3 tools/run-browser-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: output/playwright/results.json
      - name: APK
        run: android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xcloud-imagefilter
          path: |
            better-xcloud-image-filter.user.js
            android/dist/*.apk
      - name: Publicar release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
          TARGET: ${{ inputs.target || github.sha }}
          APK: ${{ inputs.apk }}
        run: |
          test -f "$NOTES" || { echo "::error::Notas não encontradas: $NOTES"; exit 1; }
          TITLE=$(head -1 "$NOTES" | sed 's/^# *//')
          tail -n +2 "$NOTES" > /tmp/notes.md
          FILES=(better-xcloud-image-filter.user.js)
          if [ "$APK" = "true" ]; then FILES+=(android/dist/*.apk); fi
          gh release create "$TAG" "${FILES[@]}" \
            --target "$TARGET" --title "$TITLE" --notes-file /tmp/notes.md
